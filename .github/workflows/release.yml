name: Release packages

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish gloss-local to npm (requires NPM_TOKEN)
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build npm tarball
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: gloss-local-*.tgz

  source-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        shell: bash
        run: |
          mkdir release-assets
          git archive --format=tar.gz --prefix="Gloss-${GITHUB_REF_NAME#v}/" \
            --output="release-assets/Gloss-source-${GITHUB_REF_NAME#v}.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Gloss-source
          path: release-assets/*

  desktop-package:
    name: Windows ${{ matrix.arch }} desktop package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            artifact_name: Gloss-windows-x64
            asset_name: Gloss-windows-x64.exe
          - arch: arm64
            runner: windows-11-arm
            artifact_name: Gloss-windows-arm64
            asset_name: Gloss-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements-build.txt
      - name: Build portable Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Smoke test Windows executable
        shell: pwsh
        run: ./dist/Gloss.exe --version
      - name: Create Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist/Gloss.exe "release-assets/${{ matrix.asset_name }}"
          if ('${{ matrix.arch }}' -eq 'x64') {
            # Keep the original direct-download asset used by earlier README links.
            Copy-Item dist/Gloss.exe release-assets/Gloss.exe
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [npm-package, source-archive, desktop-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  publish-npm:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
    needs: npm-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires Node 22.14+ and npm 11.5.1+.
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish npm package
        run: npm publish gloss-local-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
